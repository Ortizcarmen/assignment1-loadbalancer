services:

  server1:
    build: ./server1
    container_name: server1

  server2:
    build: ./server2
    container_name: server2

  loadbalancer:
    image: nginx:alpine
    container_name: loadbalancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
